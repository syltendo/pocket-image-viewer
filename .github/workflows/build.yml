name: Build core

# Builds the Analogue Pocket bitstream with Intel Quartus Prime in Docker
# (no local install needed) and packages a ready-to-install release zip.
#
# Quartus version note: the APF template targets Quartus 18.1-era IP.
# raetro/quartus:21.1.1 is era-appropriate for Cyclone V APF builds.
# If the compile step fails on IP migration, try the `pocket` tag instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with Quartus
        run: |
          docker run --rm \
            -v "$PWD:/build" -w /build/src/fpga \
            raetro/quartus:21.1.1 \
            bash -c 'quartus_sh --flow compile ap_core'

      - name: Convert RBF to bitstream.rbf_r
        run: |
          python3 tools/rbf_to_rbf_r.py \
            src/fpga/output_files/ap_core.rbf \
            Cores/syltendo.imageviewer/bitstream.rbf_r

      - name: Package release zip
        run: |
          python3 tools/package.py --version "0.1.0-$(date +%Y%m%d)"

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: pocket-image-viewer
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            src/fpga/output_files/*.rpt
            src/fpga/output_files/*.summary
          if-no-files-found: warn

      - name: Extract timing summary
        if: always()
        run: |
          RPT="src/fpga/output_files/ap_core.sta.rpt"
          OUT="timing-summary.txt"
          {
            echo "=== SDRAM output timing (dram_dq / dram_dqm / dram_a / dram_ba / ras / cas / we / cke) ==="
            echo "Constraint: set_output_delay -max 2.0ns vs 180deg SDRAM clock (5051ps)"
            echo ""
            if [ -f "$RPT" ]; then
              echo "--- report head (first 160 lines: summary, SDC list, clocks) ---"
              head -160 "$RPT"
              echo ""
              echo "--- Slow 1100mV 85C Fmax Summary ---"
              awk '/; Slow 1100mV 85C Model Fmax Summary/{f=1} f{print} /; Timing Closure Recommendations/{if(f) exit}' "$RPT" | head -60
              echo ""
              echo "--- Slow 1100mV 85C Setup Summary (worst slack per clock transfer) ---"
              awk '/; Slow 1100mV 85C Model Setup Summary/{f=1} f{print} /; Slow 1100mV 85C Model Hold Summary/{if(f) exit}' "$RPT" | head -150
            else
              echo "NOTE: $RPT not found"
            fi
          } > "$OUT" 2>&1 || true
          echo "wrote $OUT"

      - name: Detailed SDRAM output path report
        if: always()
        run: |
          cat > detail.tcl <<'TCL'
          project_open ap_core
          create_timing_netlist
          read_sdc core/core_constraints.sdc
          update_timing_netlist
          report_timing -to [get_ports dram_dq*] \
            -setup -npaths 2 -detail full_path -file detail_rpt.txt
          project_close
          TCL
          cp detail.tcl src/fpga/detail.tcl
          docker run --rm \
            -v "$PWD:/build" -w /build/src/fpga \
            raetro/quartus:21.1.1 \
            bash -c 'quartus_sta -t detail.tcl > sta_detail.log 2>&1 || true'
          OUT="output-detail.txt"
          {
            echo "=== Detailed setup paths: registers -> dram_dq/dram_dqm ==="
            echo ""
            cat src/fpga/detail_rpt.txt 2>/dev/null || echo "detail report not produced"
            echo ""
            echo "--- sta log tail ---"
            tail -30 src/fpga/sta_detail.log 2>/dev/null
          } > "$OUT" 2>&1 || true
          echo "wrote $OUT"

      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-summary
          path: timing-summary.txt
          if-no-files-found: warn

      - name: Upload output detail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-detail
          path: output-detail.txt
          if-no-files-found: warn
