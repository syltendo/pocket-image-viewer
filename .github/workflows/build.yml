name: Build core

# Builds the Analogue Pocket bitstream with Intel Quartus Prime in Docker
# (no local install needed) and packages a ready-to-install release zip.
#
# Quartus version note: the APF template targets Quartus 18.1-era IP.
# raetro/quartus:21.1.1 is era-appropriate for Cyclone V APF builds.
# If the compile step fails on IP migration, try the `pocket` tag instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with Quartus
        run: |
          docker run --rm \
            -v "$PWD:/build" -w /build/src/fpga \
            raetro/quartus:21.1.1 \
            bash -c 'quartus_sh --flow compile ap_core'

      - name: Convert RBF to bitstream.rbf_r
        run: |
          python3 tools/rbf_to_rbf_r.py \
            src/fpga/output_files/ap_core.rbf \
            Cores/syltendo.imageviewer/bitstream.rbf_r

      - name: Package release zip
        run: |
          python3 tools/package.py --version "0.1.0-$(date +%Y%m%d)"

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: pocket-image-viewer
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            src/fpga/output_files/*.rpt
            src/fpga/output_files/*.summary
          if-no-files-found: warn
